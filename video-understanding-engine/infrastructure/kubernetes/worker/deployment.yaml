# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: video-engine
  labels:
    app: worker
    app.kubernetes.io/part-of: video-understanding-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z redis.video-engine.svc.cluster.local 6379; do echo waiting for redis; sleep 3; done']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c',
            'until nc -z postgres.video-engine.svc.cluster.local 5432; do echo waiting for postgres; sleep 3; done']
      containers:
        - name: worker
          # IMPORTANT: Same image as API — uses different CMD
          image: vue-api:latest
          imagePullPolicy: IfNotPresent
          # Override the default CMD to run Celery instead
          command:
            - celery
            - -A
            - backend.workers.video_worker
            - worker
            - --loglevel=info
            - --concurrency=2
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: POSTGRES_DB
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: GEMINI_API_KEY
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vue-secrets
                  key: GROQ_API_KEY
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.video-engine.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://redis.video-engine.svc.cluster.local:6379/0"
            - name: QDRANT_URL
              value: "http://qdrant.video-engine.svc.cluster.local:6333"
            - name: MINIO_ENDPOINT
              value: "minio.video-engine.svc.cluster.local:9000"
            - name: MINIO_EXTERNAL_ENDPOINT
              value: "minio.video-engine.svc.cluster.local:9000"
            - name: MINIO_SECURE
              value: "false"
          resources:
            # Workers are heavier — FFmpeg, Tesseract, FastEmbed all run here
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
---
# HPA for Celery Worker
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: video-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
